---
- name: Login to Zabbix API
  ansible.builtin.uri:
    url: "{{ zabbix_api_url }}"
    method: POST
    headers:
      Content-Type: application/json-rpc
    body_format: json
    body:
      jsonrpc: "2.0"
      method: user.login
      params:
        username: "{{ zabbix_api_user }}"
        password: "{{ zabbix_api_password }}"
      id: 1
    return_content: true
  register: zabbix_login
  failed_when: zabbix_login.json.error is defined
  tags:
    - zabbix-api
    - login
  no_log: true

- name: Get Zabbix host group ID
  ansible.builtin.uri:
    url: "{{ zabbix_api_url }}"
    method: POST
    headers:
      Content-Type: application/json-rpc
      Authorization: "Bearer {{ zabbix_login.json.result }}"
    body_format: json
    body:
      jsonrpc: "2.0"
      method: hostgroup.get
      params:
        output:
          - groupid
          - name
        filter:
          name:
            - "{{ zabbix_host_group_name }}"
      id: 2
    return_content: true
  register: zabbix_group
  failed_when: zabbix_group.json.error is defined or zabbix_group.json.result | length == 0
  tags:
    - zabbix-api
    - lookup
  no_log: true

- name: Get Zabbix template ID
  ansible.builtin.uri:
    url: "{{ zabbix_api_url }}"
    method: POST
    headers:
      Content-Type: application/json-rpc
      Authorization: "Bearer {{ zabbix_login.json.result }}"
    body_format: json
    body:
      jsonrpc: "2.0"
      method: template.get
      params:
        output:
          - templateid
          - host
        filter:
          host:
            - "{{ zabbix_template_name }}"
      id: 3
    return_content: true
  register: zabbix_template
  failed_when: zabbix_template.json.error is defined or zabbix_template.json.result | length == 0
  tags:
    - zabbix-api
    - lookup
  no_log: true

- name: Check if hosts already exist in Zabbix
  ansible.builtin.uri:
    url: "{{ zabbix_api_url }}"
    method: POST
    headers:
      Content-Type: application/json-rpc
      Authorization: "Bearer {{ zabbix_login.json.result }}"
    body_format: json
    body:
      jsonrpc: "2.0"
      method: host.get
      params:
        output:
          - hostid
          - host
        filter:
          host:
            - "{{ item.host }}"
      id: 4
    return_content: true
  loop: "{{ zabbix_managed_hosts }}"
  register: zabbix_existing_hosts
  failed_when: zabbix_existing_hosts.json.error is defined
  tags:
    - zabbix-api
    - check
  no_log: true

- name: Create missing hosts in Zabbix
  ansible.builtin.uri:
    url: "{{ zabbix_api_url }}"
    method: POST
    headers:
      Content-Type: application/json-rpc
      Authorization: "Bearer {{ zabbix_login.json.result }}"
    body_format: json
    body:
      jsonrpc: "2.0"
      method: host.create
      params:
        host: "{{ existing_host.item.host }}"
        name: "{{ existing_host.item.host }}"
        status: 0
        interfaces:
          - type: 1
            main: 1
            useip: 1
            ip: "{{ existing_host.item.ip }}"
            dns: ""
            port: "{{ zabbix_agent_port | string }}"
        groups:
          - groupid: "{{ zabbix_group.json.result[0].groupid }}"
        templates:
          - templateid: "{{ zabbix_template.json.result[0].templateid }}"
        tags:
          - tag: managed_by
            value: ansible
          - tag: lab
            value: ccna
      id: 5
    return_content: true
  loop: "{{ zabbix_existing_hosts.results }}"
  loop_control:
    loop_var: existing_host
    label: "{{ existing_host.item.host }}"
  when: existing_host.json.result | length == 0
  register: zabbix_created_hosts
  failed_when: zabbix_created_hosts.json.error is defined
  tags:
    - zabbix-api
    - create
  no_log: true


- name: Validate no Zabbix API errors occurred
  ansible.builtin.assert:
    that:
      - (zabbix_existing_hosts.results | selectattr('json.error','defined') | list | length) == 0
    fail_msg: "One or more Zabbix API calls returned an error"
    success_msg: "No Zabbix API errors found"